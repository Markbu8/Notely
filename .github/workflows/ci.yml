name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Tests
        run: go test ./...  -cover

  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Format Check
        run: test -z $(go fmt ./...)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Gosec
        run: gosec ./...
